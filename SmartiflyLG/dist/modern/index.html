  <style>
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes boot-progress {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(172%);
      }
    }

    #boot-debug {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 44%, rgba(229, 9, 20, 0.16), transparent 28%), linear-gradient(145deg, #040507 0%, #0b0f15 52%, #020304 100%);
      color: #f3f6fb;
      font-family: 'Outfit', 'Inter', sans-serif;
      box-sizing: border-box;
    }

    #boot-debug[data-hidden="true"] {
      display: none;
    }

    /* Glow background behind spinner */
    .boot-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03), transparent 24%), radial-gradient(circle at 50% 44%, rgba(229, 9, 20, 0.08), transparent 34%);
      filter: blur(6px);
      pointer-events: none;
    }

    /* Branded Loader Spinner */
    .boot-spinner {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 999px;
      border: 5px solid rgba(255, 255, 255, 0.08);
      border-top-color: #e50914;
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 36px rgba(229, 9, 20, 0.18);
      box-sizing: border-box;
    }

    /* Brand Icon */
    .boot-logo-img {
      width: 236px;
      max-width: 42vw;
      margin-top: 2px;
    }

    /* Subtitle */
    .boot-subtitle {
      margin: 0;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* Progress Bar */
    .boot-progress-track {
      width: 56vw;
      max-width: 320px;
      height: 7px;
      padding: 1px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.12);
      box-sizing: border-box;
      margin-top: 6px;
    }

    .boot-progress-bar {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff5d67, #e50914);
      animation: boot-progress 1.2s ease-in-out infinite alternate;
    }

    /* Stable build footer text */
    .boot-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 38px;
      margin: 0;
      color: rgba(255, 255, 255, 0.22);
      font-size: 9px;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }

    /* Error panel styling */
    #boot-error-container {
      display: none;
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      background: rgba(255, 36, 56, 0.08);
      border: 1px solid rgba(255, 36, 56, 0.3);
      border-radius: 12px;
      padding: 24px;
      font-family: monospace;
      text-align: left;
      box-sizing: border-box;
      z-index: 10;
    }

    #boot-error-title {
      margin: 0 0 8px;
      color: #ff2438;
      font-size: 18px;
      font-weight: 700;
    }

    #boot-debug__status {
      margin: 0 0 12px;
      color: #ffffff;
      font-size: 14px;
    }

    #boot-debug__log {
      margin: 0;
      color: #ff9db7;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 160px;
    }

    .lg-details-scroll,
    .lg-details-scroll-x,
    .lg-browse-scroll,
    .player-channel-rail {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .lg-details-scroll::-webkit-scrollbar,
    .lg-details-scroll-x::-webkit-scrollbar,
    .lg-browse-scroll::-webkit-scrollbar,
    .player-channel-rail::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
