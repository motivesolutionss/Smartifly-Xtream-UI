version: '3.8'

services:
  mysql-local:
    image: mysql:8.0
    container_name: smartifly-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Motive500@123$
      MYSQL_DATABASE: smartifly_xtream_db
    ports:
      - "3306:3306"
    volumes:
      - smartifly_local_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pMotive500@123$"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./smartifly-xtreamui-backend
      dockerfile: Dockerfile
    container_name: smartifly-local-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:Motive500%40123%24@mysql-local:3306/smartifly_xtream_db
      - JWT_SECRET=82bfadb219c4a0e42709d144505b1879f31acdca9fce123a52cc034eaa0539af
      - JWT_ACCESS_SECRET=change_this_to_a_long_random_access_secret_123
      - JWT_REFRESH_SECRET=change_this_to_a_long_random_refresh_secret_456
      - JWT_ACCESS_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN_DAYS=30
      - LICENSE_KEY_MODE=HMAC
      - LICENSE_KEY_SECRET=smartifly_enterprise_license_secret_2025
      - LICENSE_KEY_PREFIX=ST
      - LICENSE_KEY_SIZE=20
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3002,http://localhost:5173
      - CONFIG_ENCRYPTION_KEY=gf-config-secret-key-32-bytes-1234
      - TMDB_API_KEY=6df93e02a1b4a93504599f4051344f89
    command: sh -c "npx prisma db push && node dist/src/server.js"
    depends_on:
      mysql-local:
        condition: service_healthy

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: smartifly-local-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_started

volumes:
  smartifly_local_mysql_data:
