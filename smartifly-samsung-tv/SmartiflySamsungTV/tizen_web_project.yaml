# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: SmartiflySamsungTv

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing.
# This project must use the Samsung TV certificate profile instead of
# whichever generic Tizen Studio profile happens to be active.
signing_profile: "samsungtvappcertificate"

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
files:
  - assets/*
  - center_pillar.png
  - css/style.css
  - favicon.svg
  - icon.png
  - icons.svg
  - index.html
  - left_pillar.png
  - loginscreen_image.png
  - main.js
  - right_pillar.png
  - smartifly_icon.png
  - smartifly_logo.png

# list of files to exclude based on the matched patterns
excludes:
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*

# project dependencies
deps: []
